name: Build and deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Add Apache SPA fallback
        run: |
          cat > dist/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
          </IfModule>
          EOF

      - name: Prepare PHP API
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          RAZORPAY_KEY_ID: ${{ secrets.RAZORPAY_KEY_ID }}
          RAZORPAY_KEY_SECRET: ${{ secrets.RAZORPAY_KEY_SECRET }}
        run: |
          mkdir -p dist/api
          cp api/health.php dist/api/health.php
          cp api/.htaccess dist/api/.htaccess
          python3 - <<'PY'
          import os
          from pathlib import Path

          def php_quote(value):
              return "'" + value.replace("\\", "\\\\").replace("'", "\\'") + "'"

          config = f"""<?php
          declare(strict_types=1);

          function db(): PDO
          {{
              static $pdo = null;

              if ($pdo instanceof PDO) {{
                  return $pdo;
              }}

              $host = {php_quote(os.environ['DB_HOST'])};
              $name = {php_quote(os.environ['DB_NAME'])};
              $user = {php_quote(os.environ['DB_USER'])};
              $pass = {php_quote(os.environ['DB_PASSWORD'])};

              $dsn = "mysql:host={{$host}};dbname={{$name}};charset=utf8mb4";

              $pdo = new PDO($dsn, $user, $pass, [
                  PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
                  PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
                  PDO::ATTR_EMULATE_PREPARES => false,
              ]);

              return $pdo;
          }}
          """
          config += "\n\\$GLOBALS['RAZORPAY_KEY_ID'] = " + php_quote(os.environ['RAZORPAY_KEY_ID']) + ";\n"
          config += "\\$GLOBALS['RAZORPAY_KEY_SECRET'] = " + php_quote(os.environ['RAZORPAY_KEY_SECRET']) + ";\n"
          config += "\nfunction razorpay_key_id(): string { return \\$GLOBALS['RAZORPAY_KEY_ID']; }\n"
          config += "function razorpay_key_secret(): string { return \\$GLOBALS['RAZORPAY_KEY_SECRET']; }\n"
          Path("dist/api/config.php").write_text(config, encoding="utf-8")
          PY

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ./
